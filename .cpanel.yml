---
deployment:
  tasks:
    # Saari paths $HOME se nikalti hain, hardcoded /home2/... kahin nahi.
    # App web root se bahar rehti hai, sirf public/ subdomain ka docroot hai.
    - export DP=$HOME/tekedar-app
    - export DATA=$HOME/tekedar-data
    - export LOG=$HOME/tekedar-deploy.log
    - export PHP=/opt/cpanel/ea-php85/root/usr/bin/php
    - export VENDOR_URL=https://github.com/talhakhan143/tekedar-hisaab/releases/download/vendor-1/vendor.tar.gz
    - 'date > $LOG'
    - 'echo "[env] user=$(whoami) php=$($PHP -v 2>&1 | head -1)" >> $LOG 2>&1'
    - mkdir -p $DP $DATA $HOME/tmp
    # Code copy karo. .git aur .env kabhi nahi chhuna.
    - 'rsync -a --exclude ".git" --exclude ".env" --exclude "storage/logs" --exclude "tests" --exclude "node_modules" ./ $DP/ >> $LOG 2>&1 || cp -R ./ $DP/ >> $LOG 2>&1'
    - 'rm -rf $DP/.git $DP/node_modules $DP/tests'
    # Apache ko $DP ke andar jaana hota hai. 700 reh gaya to poori site 403 degi.
    - 'chmod 755 $DP $DATA'
    - 'echo "[copy] done perms=$(stat -c %a $DP 2>/dev/null || stat -f %Lp $DP)" >> $LOG'
    # cPanel PHP version ko docroot ki .htaccess me likhta hai. Upar wali rsync
    # us file ko repo wali se badal deti hai, handler ur jata hai, site system
    # default PHP 8.3 par gir jati hai aur composer ka platform_check (8.4.1
    # chahiye) poori site ko 500 kar deta hai. Is liye handler har deploy par
    # wapas laga do.
    - 'if ! grep -q "ea-php85" $DP/public/.htaccess 2>/dev/null; then printf "\n# php -- BEGIN cPanel-generated handler, do not edit\n<IfModule mime_module>\n  AddHandler application/x-httpd-ea-php85___lsphp .php .php8 .phtml\n</IfModule>\n# php -- END cPanel-generated handler, do not edit\n" >> $DP/public/.htaccess; echo "[php-handler] dobara lagaya" >> $LOG; else echo "[php-handler] pehle se mojood" >> $LOG; fi'
    # Writable dirs
    - 'mkdir -p $DP/storage/framework/cache/data $DP/storage/framework/sessions $DP/storage/framework/views $DP/storage/logs $DP/bootstrap/cache'
    - 'chmod -R 775 $DP/storage $DP/bootstrap/cache'
    # Dev ke artifacts aur purane caches
    - 'rm -f $DP/public/hot $DP/bootstrap/cache/config.php $DP/bootstrap/cache/routes-v7.php $DP/bootstrap/cache/packages.php $DP/bootstrap/cache/services.php'
    # Vendor. Pehle server ka composer, nahi mila to release wala tarball.
    # composer.lock ka nishan, taake har deploy par 54 MB dobara na utre.
    - 'export LOCKSIG=$(md5sum $DP/composer.lock 2>/dev/null | cut -d" " -f1)'
    - '[ -n "$LOCKSIG" ] || export LOCKSIG=$(cksum $DP/composer.lock | cut -d" " -f1)'
    # Pehle se laga hua vendor chalta rahe to haath hi mat lagao. Is tarah
    # repo private ho jaye aur tarball na mile tab bhi deploy site nahi marta.
    # Jab tarball lana pare to pehle -f se poochho ke sahi mila bhi (bina -f
    # curl 404 ka HTML bhi khushi khushi file me likh deta hai), phir tar se
    # tasdeeq karo, aur purana vendor SIRF tab mitao jab naya tayar ho.
    - 'if [ -f $DP/vendor/autoload.php ] && [ "$(cat $DATA/vendor.sig 2>/dev/null)" = "$LOCKSIG" ]; then echo "[vendor] pehle se laga hai, composer.lock badli nahi" >> $LOG; elif command -v composer >/dev/null 2>&1; then cd $DP && composer install --no-dev --optimize-autoloader --no-interaction --no-progress >> $LOG 2>&1 && echo "$LOCKSIG" > $DATA/vendor.sig && echo "[vendor] composer ok" >> $LOG; elif [ -f /opt/cpanel/composer/bin/composer ]; then cd $DP && $PHP /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --no-progress >> $LOG 2>&1 && echo "$LOCKSIG" > $DATA/vendor.sig && echo "[vendor] composer-opt ok" >> $LOG; else echo "[vendor] composer nahi hai, tarball se lagate hain" >> $LOG; if curl -fsSL --retry 3 -o $HOME/tmp/tk-vendor.tgz "$VENDOR_URL" 2>> $LOG && tar -tzf $HOME/tmp/tk-vendor.tgz > /dev/null 2>&1; then rm -rf $DP/vendor && tar -xzf $HOME/tmp/tk-vendor.tgz -C $DP >> $LOG 2>&1 && echo "$LOCKSIG" > $DATA/vendor.sig && echo "[vendor] tarball ok" >> $LOG; else echo "[vendor] tarball NAHI MILA. Purana vendor jyun ka tyun chhod dia, site chalti rahegi." >> $LOG; fi; rm -f $HOME/tmp/tk-vendor.tgz; fi'
    - 'echo "[vendor] autoload present=$([ -f $DP/vendor/autoload.php ] && echo yes || echo no)" >> $LOG'
    # SQLite file. Web root se bahar, is liye browser se download nahi ho sakti.
    - 'touch $DATA/database.sqlite && chmod 664 $DATA/database.sqlite'
    # Schema aur demo data. Sirf tab jab .env aur vendor dono mojood hon.
    - 'if [ -f $DP/.env ] && [ -f $DP/vendor/autoload.php ]; then cd $DP && $PHP artisan package:discover --ansi >> $LOG 2>&1; $PHP artisan migrate --force >> $LOG 2>&1 && echo "[migrate] ok" >> $LOG || echo "[migrate] FAIL" >> $LOG; if [ ! -f $DATA/.seeded ]; then $PHP artisan db:seed --force >> $LOG 2>&1 && touch $DATA/.seeded && echo "[seed] ok" >> $LOG || echo "[seed] FAIL" >> $LOG; else echo "[seed] skipped, pehle ho chuka" >> $LOG; fi; else echo "[migrate] skipped" >> $LOG; fi'
    - 'if [ -f $DP/vendor/autoload.php ]; then cd $DP && $PHP artisan storage:link >> $LOG 2>&1; $PHP artisan config:cache >> $LOG 2>&1; $PHP artisan route:cache >> $LOG 2>&1; $PHP artisan view:cache >> $LOG 2>&1; echo "[optimize] ok" >> $LOG; fi'
    - 'echo "[disk] home=$(du -sh $HOME 2>/dev/null | cut -f1) app=$(du -sh $DP 2>/dev/null | cut -f1) db=$(du -h $DATA/database.sqlite 2>/dev/null | cut -f1)" >> $LOG 2>&1'
    # Quota sirf 500 MB hai, is liye har deploy bata de ke jagah kahan ja rahi hai.
    - 'echo "[disk-detail] $(du -sh $DP/* $DP/.[!.]* 2>/dev/null | sort -rh | head -8 | tr "\n" " " | tr "\t" ":")" >> $LOG 2>&1'
    - 'echo "[disk-home] $(du -sh $HOME/* 2>/dev/null | sort -rh | head -6 | tr "\n" " " | tr "\t" ":")" >> $LOG 2>&1'
    # Deploy khud apna smoke test kare, taake log dekh kar pata chale site zinda hai.
    - 'echo "[smoke] login_http=$(curl -sS -o /dev/null -w %{http_code} --max-time 30 https://hisaab.baryal.com.pk/login)" >> $LOG 2>&1'
    - 'echo "[smoke] php_runtime=$(curl -sS --max-time 30 -o /dev/null -w %{http_code} https://hisaab.baryal.com.pk/)" >> $LOG 2>&1'
    # Har pull loose git objects chhorta hai. Is server ka filesystem bade
    # blocks use karta hai, is liye har chhoti object poora block kha jati hai
    # aur clone phool kar 135 MB ho chuka tha jab ke asli data 10 MB bhi nahi.
    # Pack kar dene se wahi data chand files me simat jata hai.
    - 'GITBIN=/usr/local/cpanel/3rdparty/bin/git; command -v git > /dev/null 2>&1 && GITBIN=git; cd $HOME/repositories/tekedar-hisaab && $GITBIN gc --quiet --prune=now >> $LOG 2>&1 && echo "[gc] repo pack ho gaya" >> $LOG || echo "[gc] gc nahi chala" >> $LOG'
    - 'echo "[disk-after-gc] home=$(du -sh $HOME 2>/dev/null | cut -f1) repo=$(du -sh $HOME/repositories 2>/dev/null | cut -f1)" >> $LOG 2>&1'
    - 'echo "DEPLOY-FINISHED" >> $LOG'
